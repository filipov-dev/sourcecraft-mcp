[package]
name = "sourcecraft-mcp-core"
description = "Transport-agnostic MCP tools for the SourceCraft REST API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
jaq-core = "3.1.2"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.4"
percent-encoding = "2.3.2"
regex = "1.13.1"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sourcecraft-api = { version = "0.3.0", path = "../sourcecraft-api" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "fs", "time", "sync", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
rmcp = { version = "3.8.0", features = ["client", "server", "transport-io"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3.23"
wiremock = "0.6.5"

[lints]
workspace = true
