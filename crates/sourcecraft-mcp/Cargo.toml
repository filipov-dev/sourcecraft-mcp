[package]
name = "sourcecraft-mcp"
description = "MCP server and CLI for the SourceCraft REST API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
rmcp = { version = "3.8.0", features = ["server", "transport-io"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sourcecraft-api = { version = "0.1.1", path = "../sourcecraft-api" }
sourcecraft-mcp-core = { version = "0.1.1", path = "../sourcecraft-mcp-core" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "process", "io-util", "io-std", "fs"] }
toml = "1.2.0"
toml_edit = "0.25.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
