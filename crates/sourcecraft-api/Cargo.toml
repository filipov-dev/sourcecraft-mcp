[package]
name = "sourcecraft-api"
description = "SourceCraft REST API: specification-driven operations, request executor and token storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart", "stream", "query", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util"] }
tracing = "0.1.44"
url = "2.5.8"

[lints]
workspace = true

[build-dependencies]
serde_json = "1.0.154"

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
